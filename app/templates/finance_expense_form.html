{% extends "base.html" %}
{% block title %}{{ '編輯費用' if e else '新增費用' }} · 桂圓帳房{% endblock %}
{% block body %}
<div class="head"><div>
  <div class="sup"><a href="/finance">財務健康</a> / <a href="/finance/expenses">營運費用</a> / {{ '編輯' if e else '新增' }}</div>
  <h1 class="serif">{{ '編輯費用' if e else '新增一筆費用' }}</h1>
</div></div>
<hr class="rule">

<form method="post" action="/finance/expenses">
{% if e %}<input type="hidden" name="expense_id" value="{{ e.expense_id }}">{% endif %}
<div class="card" style="max-width:680px">
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div><label>月份(攤提時 = 起始月)</label>
      <input name="ym" value="{{ e.ym if e else ym_default }}" placeholder="2026-09" required></div>
    <div><label>項目</label>
      <select name="category" required>
        {% for c in cats %}<option {{ 'selected' if e and e.category == c }}>{{ c }}</option>{% endfor %}
      </select></div>
    <div><label>金額(實際花的錢)</label>
      <input name="amount" type="number" step="1" value="{{ e.amount|round(0) if e else '' }}" required></div>
    <div><label>攤提月數(一次性大支出才填)</label>
      <input name="amortize_months" type="number" min="1" step="1"
             value="{{ e.amortize_months if e and e.amortize_months else '' }}" placeholder="留白 = 當月全額">
      <div class="muted" style="font-size:11px;margin-top:3px">例:研發花 30 萬、分 36 個月 → 填 36,每月認列約 8,333</div>
    </div>
  </div>

  <div style="margin-top:12px"><label>備註</label><input name="note" value="{{ e.note if e else '' }}"></div>
  <div style="margin-top:16px">
    <button type="submit">儲存</button>
    <a href="/finance/expenses" style="margin-left:12px">取消</a>
    {% if e %}
    <button type="submit" name="_delete" value="1" class="ghost" style="margin-left:16px"
            onclick="return confirm('刪除這筆費用?')">刪除</button>
    {% endif %}
  </div>
</div>
</form>
{% endblock %}
