{# 產季(或西曆年)多選下拉。放在某個 <form method="get"> 裡;需要 context:
   view、seasons、seasons_sel、years、years_sel #}
<div class="chips" style="margin-right:10px;display:inline-flex">
  <a class="chip" href="?view=season"
     style="{{ 'background:var(--seal);color:#FBF6EA;border-color:var(--seal)' if view=='season' }}">依產季</a>
  <a class="chip" href="?view=calendar"
     style="{{ 'background:var(--seal);color:#FBF6EA;border-color:var(--seal)' if view=='calendar' }}">依西曆年</a>
</div>
{% if view == 'calendar' %}
<input type="hidden" name="view" value="calendar">
<span>年度</span>
{% else %}
<span>產季</span>
{% endif %}
<div class="msel" id="seasonMsel">
  <button type="button" class="msel-btn" id="seasonBtn" aria-haspopup="true" aria-expanded="false">
    <span id="seasonLabel">{{ '全部年度' if view=='calendar' else '全部產季' }}</span><span class="msel-caret">▾</span>
  </button>
  <div class="msel-panel" id="seasonPanel" hidden>
    {% if view == 'calendar' %}
    <label><input type="checkbox" name="year" value="all" {{ 'checked' if not years_sel }}> 全部</label>
    {% for y in years %}
    <label><input type="checkbox" name="year" value="{{ y }}" {{ 'checked' if y in years_sel }}> {{ y }}</label>
    {% endfor %}
    {% else %}
    <label><input type="checkbox" name="season" value="all" {{ 'checked' if not seasons_sel }}> 全部</label>
    {% for s in seasons %}
    <label><input type="checkbox" name="season" value="{{ s }}" {{ 'checked' if s in seasons_sel }}> {{ s }}</label>
    {% endfor %}
    {% endif %}
    <div class="msel-foot"><button type="submit" class="ghost msel-apply">套用</button></div>
  </div>
</div>
<script>
(function () {
  var wrap = document.getElementById('seasonMsel');
  if (!wrap || wrap.dataset.wired) return;
  wrap.dataset.wired = '1';
  var fieldName = {{ "'year'" if view == 'calendar' else "'season'" }};
  var allLabel = {{ "'全部年度'" if view == 'calendar' else "'全部產季'" }};
  var unitLabel = {{ "'年'" if view == 'calendar' else "'產季'" }};
  var f = wrap.closest('form');
  var btn = document.getElementById('seasonBtn');
  var panel = document.getElementById('seasonPanel');
  var label = document.getElementById('seasonLabel');
  var all = panel.querySelector('input[value="all"]');
  var yrs = [].slice.call(panel.querySelectorAll('input[name=' + fieldName + ']')).filter(function (c) { return c !== all; });
  function sig() { return [].map.call(panel.querySelectorAll('input[name=' + fieldName + ']'), function (c) { return c.checked ? c.value : ''; }).join(','); }
  var startSig = sig();
  function relabel() {
    var on = yrs.filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
    label.textContent = (all.checked || on.length === 0) ? allLabel : on.join('、') + ' ' + unitLabel;
  }
  function openP() { panel.hidden = false; btn.setAttribute('aria-expanded', 'true'); }
  function closeP() {
    panel.hidden = true; btn.setAttribute('aria-expanded', 'false');
    if (f && sig() !== startSig) f.submit();
  }
  relabel();
  btn.addEventListener('click', function () { panel.hidden ? openP() : closeP(); });
  panel.addEventListener('change', function (e) {
    if (e.target === all) { if (all.checked) yrs.forEach(function (c) { c.checked = false; }); }
    else if (e.target.checked) { all.checked = false; }
    if (!all.checked && !yrs.some(function (c) { return c.checked; })) all.checked = true;
    relabel();
  });
  document.addEventListener('click', function (e) {
    if (!wrap.contains(e.target) && !panel.hidden) closeP();
  });
})();
</script>
