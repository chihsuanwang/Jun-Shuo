{% if tab != 'compare' %}
<div class="chips" style="margin:0 10px 8px 0;display:inline-flex">
  <a class="chip" href="?view=season{% if tab %}&tab={{ tab }}{% endif %}"
     style="{{ 'background:var(--seal);color:#FBF6EA;border-color:var(--seal)' if view=='season' }}">依產季</a>
  <a class="chip" href="?view=calendar{% if tab %}&tab={{ tab }}{% endif %}"
     style="{{ 'background:var(--seal);color:#FBF6EA;border-color:var(--seal)' if view=='calendar' }}">依西曆年</a>
</div>
{% endif %}
<form method="get" class="filterbar">
  {% if tab %}<input type="hidden" name="tab" value="{{ tab }}">{% endif %}
  {% if view == 'calendar' %}
  <input type="hidden" name="view" value="calendar">
  <span>年度</span>
  <select name="year" onchange="this.form.submit()">
    <option value="all" {{ 'selected' if year_sel == 'all' }}>全部</option>
    {% for y in years %}<option value="{{ y }}" {{ 'selected' if year_sel == y|string }}>{{ y }}</option>{% endfor %}
  </select>
  {% else %}
  <span>產季</span>
  <select name="season" onchange="this.form.submit()">
    <option value="all" {{ 'selected' if season_sel == 'all' }}>全部</option>
    {% for s in seasons %}<option value="{{ s }}" {{ 'selected' if season_sel == s|string }}>{{ s }}</option>{% endfor %}
  </select>
  {% endif %}
</form>
